AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Funcao serverless do Rota Vital para gerar guia de transporte.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Resources:
  GuiaTransporteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Events:
        GerarGuia:
          Type: Api
          Properties:
            Path: /guias
            Method: post
